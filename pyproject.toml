[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsip"
version = "0.1.0"
description = "Quant Signal Intelligence Platform shared Python library"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "polars>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "schedule>=1.2.0",
    "yfinance>=0.2.41",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "transformers>=4.44.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "catboost>=1.2.7",
    "vectorbt>=0.26.0",
    "ollama>=0.3.0",
    "shap>=0.45.0",
    "minio>=7.2.0",
    "PyJWT>=2.9.0",
    "passlib>=1.7.4",
    "bcrypt>=4.2.0",
    "pandera>=0.20.0",
    "pydantic-settings>=2.4.0",
    "python-jose>=3.3.0",
    "flask>=3.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.23.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-psycopg>=0.47b0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.8.0",
    "locust>=2.31.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/qsip"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
